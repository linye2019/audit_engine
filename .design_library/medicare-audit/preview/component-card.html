<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card - Medicare Audit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-4); align-items: flex-start; margin-bottom: var(--space-4); flex-wrap: wrap; }
.label { font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-on-surface-variant); min-width: 92px; flex-shrink: 0; line-height: var(--line-height-eyebrow); padding-top: 2px; }
.divider { border: none; border-top: 1px solid var(--color-outline-variant); margin: var(--space-3) 0; }
.card-grid { display: flex; gap: var(--space-4); flex-wrap: wrap; flex: 1; min-width: 0; }
.card-grid > * { flex: 1; min-width: 180px; }
/* @component-css-start */
/* Component definitions — extracted to components.css */
.card { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); border: 1px solid var(--color-border); padding: var(--space-5); display: flex; flex-direction: column; transition: box-shadow .15s; }
.card:hover { box-shadow: var(--shadow-3); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
.card-title { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); color: var(--color-on-surface); line-height: var(--line-height-h4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.card-meta { font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); color: var(--color-on-surface-variant); white-space: nowrap; flex-shrink: 0; margin-left: var(--space-2); }
.card-body { font-size: var(--font-size-body); font-weight: var(--font-weight-body); color: var(--color-on-surface); line-height: var(--line-height-body); flex: 1; }
.card-footer { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-4); margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--color-outline-variant); }
.card-action { font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); color: var(--color-primary); cursor: pointer; white-space: nowrap; transition: color .15s; }
.card-action:hover { color: var(--color-primary-hover); }
.card-action.secondary { color: var(--color-on-surface-variant); }
.card-action.secondary:hover { color: var(--color-on-surface); }
.card-stat { background: var(--color-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); border: 1px solid var(--color-border); padding: var(--space-5); display: flex; align-items: center; gap: var(--space-4); transition: box-shadow .15s; }
.card-stat:hover { box-shadow: var(--shadow-3); }
.stat-icon { width: 48px; height: 48px; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-icon.primary { background: var(--color-primary-container); color: var(--color-on-primary-container); }
.stat-icon.success { background: var(--med-green-50); color: var(--color-success); }
.stat-icon.warning { background: var(--med-amber-50); color: var(--color-warning); }
.stat-info { min-width: 0; }
.stat-value { font-family: var(--font-heading); font-size: var(--font-size-h3); font-weight: var(--font-weight-h3); color: var(--color-on-surface); line-height: 1.2; white-space: nowrap; }
.stat-label { font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); color: var(--color-on-surface-variant); line-height: var(--line-height-caption); margin-top: 2px; white-space: nowrap; }
.card-accent { background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-1); padding: var(--space-4); border-left: 3px solid var(--color-primary); transition: box-shadow .15s; }
.card-accent:hover { box-shadow: var(--shadow-2); }
.card-accent.accent-success { border-left-color: var(--color-success); }
.card-accent.accent-warning { border-left-color: var(--color-warning); }
.card-accent-title { font-family: var(--font-heading); font-size: var(--font-size-body); font-weight: var(--font-weight-h4); color: var(--color-on-surface); line-height: var(--line-height-h4); margin-bottom: var(--space-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-accent-desc { font-size: var(--font-size-caption); font-weight: var(--font-weight-caption); color: var(--color-on-surface-variant); line-height: var(--line-height-caption); }
/* @component-css-end */
</style>
</head>
<body>

<div class="row">
  <span class="label">默认卡片</span>
  <div class="card" style="flex:1;min-width:0;" data-evidence-sample="default">
    <div class="card-header">
      <span class="card-title">智能分析</span>
      <span class="card-meta">2024年Q1</span>
    </div>
    <div class="card-body">本季度共完成 1,280 条审核规则的执行分析，发现 42 条异常规则需要进一步排查，建议重点关注住院费用审核模块。</div>
    <div class="card-footer">
      <span class="card-action secondary">导出报告</span>
      <span class="card-action">查看详情</span>
    </div>
  </div>
</div>

<div class="row">
  <span class="label">统计卡片</span>
  <div class="card-grid">
    <div class="card-stat" data-evidence-sample="stat">
      <div class="stat-icon primary"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/list-checks.svg" width="24" height="24" alt="list-checks"></div>
      <div class="stat-info"><div class="stat-value">1,286</div><div class="stat-label">规则总数</div></div>
    </div>
    <div class="card-stat">
      <div class="stat-icon success"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/activity.svg" width="24" height="24" alt="activity"></div>
      <div class="stat-info"><div class="stat-value">943</div><div class="stat-label">活跃规则</div></div>
    </div>
    <div class="card-stat">
      <div class="stat-icon warning"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/target.svg" width="24" height="24" alt="target"></div>
      <div class="stat-info"><div class="stat-value">96.8%</div><div class="stat-label">审核通过率</div></div>
    </div>
  </div>
</div>

<hr class="divider">

<div class="row">
  <span class="label">状态卡片</span>
  <div class="card-grid">
    <div class="card-accent" data-evidence-sample="accent-left">
      <div class="card-accent-title">覆盖率分析</div>
      <div class="card-accent-desc">当前规则覆盖率已达到 87.3%，超出目标阈值</div>
    </div>
    <div class="card-accent accent-success">
      <div class="card-accent-title">审核任务完成</div>
      <div class="card-accent-desc">本月批量审核任务已全部完成，无待处理项</div>
    </div>
    <div class="card-accent accent-warning">
      <div class="card-accent-title">规则更新提醒</div>
      <div class="card-accent-desc">3 条规则将于下周到期，请及时更新配置</div>
    </div>
  </div>
</div>

</body>
</html>
