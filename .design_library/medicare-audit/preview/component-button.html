<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button - Medicare Audit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
/* Page scaffold — NOT extracted */
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-3); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { min-width: 92px; font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); color: var(--color-on-surface-variant); letter-spacing: 0.08em; text-transform: uppercase; }
.divider { border: none; border-top: 1px solid var(--color-outline); margin: var(--space-3) 0; }

/* @component-css-start */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); border: none; cursor: pointer; font-family: var(--font-family-base); font-weight: var(--font-weight-body); white-space: nowrap; flex-shrink: 0; border-radius: var(--radius-md); transition: background .15s, border-color .15s; }
.btn.sm { height: var(--size-button-height-sm); min-width: var(--size-button-height-sm); padding: 6px 14px; font-size: var(--font-size-caption); }
.btn.md { height: var(--size-button-height); min-width: var(--size-button-height); padding: 8px 20px; font-size: var(--font-size-body); }
.btn.lg { height: var(--size-button-height-lg); min-width: var(--size-button-height-lg); padding: 10px 28px; font-size: var(--font-size-lead); }
.btn.primary { background: var(--color-primary); color: var(--color-on-primary); }
.btn.primary:hover { background: var(--color-primary-hover); }
.btn.secondary { background: transparent; color: var(--color-primary); border: 1px solid var(--color-primary); }
.btn.secondary:hover { background: var(--interactive-hover); }
.btn.ghost { background: transparent; color: var(--color-on-surface-variant); }
.btn.ghost:hover { background: var(--interactive-hover); }
.btn.danger { background: var(--color-error); color: var(--color-on-error); }
.btn.danger:hover { filter: brightness(.92); }
.btn:disabled { opacity: .5; pointer-events: none; }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">主操作</span><button class="btn primary sm">提交审核</button><button class="btn primary md">开始审核</button><button class="btn primary lg">生成报告</button></div>
<div class="row"><span class="label">次要操作</span><button class="btn secondary sm">筛选</button><button class="btn secondary md">导出数据</button><button class="btn secondary lg">批量处理</button></div>
<hr class="divider">
<div class="row"><span class="label">文字操作</span><button class="btn ghost sm">取消</button><button class="btn ghost md">查看详情</button><button class="btn ghost lg">了解更多</button></div>
<div class="row"><span class="label">危险操作</span><button class="btn danger sm">删除</button><button class="btn danger md">删除记录</button><button class="btn danger lg">终止审核</button></div>
<div class="row"><span class="label">禁用状态</span><button class="btn primary md" disabled>开始审核</button><button class="btn secondary md" disabled>导出数据</button><button class="btn ghost md" disabled>查看详情</button><button class="btn danger md" disabled>删除记录</button></div>
</body>
</html>
