<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Badge — Medicare Audit</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-family-base); color: var(--color-on-surface); }
  .row { display: flex; gap: var(--space-4); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { font-size: var(--font-size-eyebrow); font-weight: var(--font-weight-eyebrow); color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.08em; min-width: 92px; flex-shrink: 0; }
  .divider { border: none; border-top: 1px solid var(--color-outline-variant); margin: var(--space-3) 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: var(--radius-full); font-size: var(--font-size-caption); font-weight: var(--font-weight-body); white-space: nowrap; line-height: var(--line-height-caption); }
  .badge.success { background: rgba(16,185,129,.1); color: var(--med-green-700); }
  .badge.warning { background: rgba(245,158,11,.1); color: var(--med-amber-700); }
  .badge.error { background: rgba(239,68,68,.1); color: var(--med-red-700); }
  .badge.info { background: rgba(6,182,212,.1); color: var(--med-cyan-700); }
  /* @component-css-end */
</style>
</head>
<body>
  <div class="row">
    <span class="label">审核状态</span>
    <span class="badge success">合规</span>
    <span class="badge warning">可疑</span>
    <span class="badge error">违规</span>
    <span class="badge info">信息</span>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">行内场景</span>
    <span style="font-size:var(--font-size-body);color:var(--color-on-surface);">编码验证 <span class="badge success">合规</span></span>
    <span style="font-size:var(--font-size-body);color:var(--color-on-surface);">费用核查 <span class="badge warning">可疑</span></span>
    <span style="font-size:var(--font-size-body);color:var(--color-on-surface);">超量提醒 <span class="badge error">违规</span></span>
    <span style="font-size:var(--font-size-body);color:var(--color-on-surface);">规则说明 <span class="badge info">信息</span></span>
  </div>
</body>
</html>
